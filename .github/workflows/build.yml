name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test

  completions:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate shell completions
        run: |
          cargo build
          ./scripts/generate-completions.sh ./target/debug/ar7json
      - name: Generate binary aliases
        run: ./scripts/generate-symlinks.sh ./target/debug/ar7json
      - name: Upload completions
        uses: actions/upload-artifact@v7
        with:
          name: shell-completions
          path: completions/
          retention-days: 14
      - name: Upload binary aliases
        uses: actions/upload-artifact@v7
        with:
          name: binary-aliases
          path: symlinks/
          retention-days: 14

  build:
    needs: [test, completions]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: ar7json-linux-amd64
            os: ubuntu-latest
            use-cross: true
            make-deb: true
            make-rpm: true
          - target: aarch64-unknown-linux-gnu
            artifact: ar7json-linux-arm64
            os: ubuntu-latest
            use-cross: true
            make-deb: true
            make-rpm: true
          - target: armv7-unknown-linux-gnueabihf
            artifact: ar7json-linux-armv7
            os: ubuntu-latest
            use-cross: true
            make-deb: true
          - target: x86_64-unknown-linux-musl
            artifact: ar7json-linux-amd64-musl
            os: ubuntu-latest
            use-cross: true
          - target: x86_64-apple-darwin
            artifact: ar7json-macos-amd64
            os: macos-latest
            use-cross: false
          - target: aarch64-apple-darwin
            artifact: ar7json-macos-arm64
            os: macos-latest
            use-cross: false
          - target: x86_64-pc-windows-msvc
            artifact: ar7json-windows-amd64.exe
            os: windows-latest
            use-cross: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: shell-completions
          path: completions/

      - uses: actions/download-artifact@v8
        with:
          name: binary-aliases
          path: symlinks/

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary (cross)
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build release binary (cargo)
        if: ${{ !matrix.use-cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/ar7json${{ endsWith(matrix.artifact, '.exe') && '.exe' || '' }}
          retention-days: 14

      - name: Create symlinks
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          while read name; do ln -s ar7json "$name"; done < "$GITHUB_WORKSPACE/symlinks/symlinks"

      - name: Create archive (unix)
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows'
        run: ./scripts/create-archive-unix.sh "${{ matrix.target }}" "${{ github.ref_name }}" "$GITHUB_WORKSPACE"

      - name: Create archive (windows)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/create-archive-windows.ps1 "${{ matrix.target }}" "${{ github.ref_name }}" "$env:GITHUB_WORKSPACE"

      - name: Build Debian package
        if: startsWith(github.ref, 'refs/tags/') && matrix.make-deb
        run: ./scripts/build-deb.sh "${{ matrix.target }}" "${{ github.ref_name }}" "$GITHUB_WORKSPACE"

      - name: Install rpm-build
        if: startsWith(github.ref, 'refs/tags/') && matrix.make-rpm
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build RPM package
        if: startsWith(github.ref, 'refs/tags/') && matrix.make-rpm
        run: ./scripts/build-rpm.sh "${{ matrix.target }}" "${{ github.ref_name }}" "$GITHUB_WORKSPACE"

      - name: Upload archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: ar7json-${{ github.ref_name }}-${{ matrix.target }}
          path: ar7json-${{ github.ref_name }}-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: ar7json-${{ github.ref_name }}-*
          path: artifacts/
          merge-multiple: true

      - name: Generate checksums
        run: ./scripts/generate-checksums.sh "${{ github.ref_name }}" artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*
