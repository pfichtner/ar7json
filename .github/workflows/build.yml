name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: ar7json-linux-amd64
            os: ubuntu-latest
            use-cross: true
            make-deb: true
            make-rpm: true
          - target: aarch64-unknown-linux-gnu
            artifact: ar7json-linux-arm64
            os: ubuntu-latest
            use-cross: true
            make-deb: true
            make-rpm: true
          - target: armv7-unknown-linux-gnueabihf
            artifact: ar7json-linux-armv7
            os: ubuntu-latest
            use-cross: true
            make-deb: true
          - target: x86_64-unknown-linux-musl
            artifact: ar7json-linux-amd64-musl
            os: ubuntu-latest
            use-cross: true
          - target: x86_64-apple-darwin
            artifact: ar7json-macos-amd64
            os: macos-latest
            use-cross: false
          - target: aarch64-apple-darwin
            artifact: ar7json-macos-arm64
            os: macos-latest
            use-cross: false
          - target: x86_64-pc-windows-msvc
            artifact: ar7json-windows-amd64.exe
            os: windows-latest
            use-cross: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary (cross)
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build release binary (cargo)
        if: ${{ !matrix.use-cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/ar7json${{ endsWith(matrix.artifact, '.exe') && '.exe' || '' }}
          retention-days: 14

      - name: Create archive (unix)
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../ar7json-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ar7json

      - name: Create archive (windows)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ar7json.exe -DestinationPath ../../../ar7json-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Install cargo-deb
        if: startsWith(github.ref, 'refs/tags/') && matrix.make-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build Debian package
        if: startsWith(github.ref, 'refs/tags/') && matrix.make-deb
        run: |
          cargo deb --no-build --target ${{ matrix.target }} \
            --output ar7json-${{ github.ref_name }}-${{ matrix.target }}.deb

      - name: Install cargo-generate-rpm
        if: startsWith(github.ref, 'refs/tags/') && matrix.make-rpm
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate-rpm

      - name: Build RPM package
        if: startsWith(github.ref, 'refs/tags/') && matrix.make-rpm
        run: |
          cargo generate-rpm --target ${{ matrix.target }} \
            --output ar7json-${{ github.ref_name }}-${{ matrix.target }}.rpm

      - name: Upload archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ar7json-${{ github.ref_name }}-${{ matrix.target }}
          path: ar7json-${{ github.ref_name }}-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ar7json-${{ github.ref_name }}-*
          path: artifacts/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          for f in *; do
            sha256sum "$f" >> "${{ github.ref_name }}-SHA256SUMS.txt"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*
