name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: ar7json-linux-amd64
            os: ubuntu-latest
            use-cross: true
            make-deb: true
            make-rpm: true
          - target: aarch64-unknown-linux-gnu
            artifact: ar7json-linux-arm64
            os: ubuntu-latest
            use-cross: true
            make-deb: true
            make-rpm: true
          - target: armv7-unknown-linux-gnueabihf
            artifact: ar7json-linux-armv7
            os: ubuntu-latest
            use-cross: true
            make-deb: true
          - target: x86_64-unknown-linux-musl
            artifact: ar7json-linux-amd64-musl
            os: ubuntu-latest
            use-cross: true
          - target: x86_64-apple-darwin
            artifact: ar7json-macos-amd64
            os: macos-latest
            use-cross: false
          - target: aarch64-apple-darwin
            artifact: ar7json-macos-arm64
            os: macos-latest
            use-cross: false
          - target: x86_64-pc-windows-msvc
            artifact: ar7json-windows-amd64.exe
            os: windows-latest
            use-cross: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary (cross)
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build release binary (cargo)
        if: ${{ !matrix.use-cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/ar7json${{ endsWith(matrix.artifact, '.exe') && '.exe' || '' }}
          retention-days: 14

      - name: Create symlinks
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          ln -s ar7json ar7-to-json
          ln -s ar7json json-to-ar7
          ln -s ar7json ar7-check
          ln -s ar7json ar7-fmt

      - name: Create archive (unix)
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../ar7json-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            ar7json ar7-to-json json-to-ar7 ar7-check ar7-fmt

      - name: Create archive (windows)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ar7json.exe -DestinationPath ../../../ar7json-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Build Debian package
        if: startsWith(github.ref, 'refs/tags/') && matrix.make-deb
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)     ARCH=amd64 ;;
            aarch64-unknown-linux-gnu)    ARCH=arm64 ;;
            armv7-unknown-linux-gnueabihf) ARCH=armhf ;;
          esac
          PKG_DIR="ar7json_${VERSION}_${ARCH}"
          mkdir -p "$PKG_DIR/DEBIAN" "$PKG_DIR/usr/bin"
          cp "target/${{ matrix.target }}/release/ar7json" "$PKG_DIR/usr/bin/"
          cd "$PKG_DIR/usr/bin"
          ln -s ar7json ar7-to-json
          ln -s ar7json json-to-ar7
          ln -s ar7json ar7-check
          ln -s ar7json ar7-fmt
          cd ../../..
          cat > "$PKG_DIR/DEBIAN/control" <<EOF
          Package: ar7json
          Version: $VERSION
          Architecture: $ARCH
          Depends: \${misc:Depends}
          Maintainer: Peter Fichtner <1958485+pfichtner@users.noreply.github.com>
          Description: Standalone AR7 to JSON converter for AVM FRITZ!Box ar7.cfg configuration files
           Standalone converter between AVM FRITZ!Box ar7.cfg (AR7) format and JSON.
           Parses AVM export files including the header and produces round-trip-safe
           output in both directions.
          Section: utils
          Priority: optional
          EOF
          dpkg-deb --build "$PKG_DIR" "ar7json-${{ github.ref_name }}-${{ matrix.target }}.deb"

      - name: Install rpm-build
        if: startsWith(github.ref, 'refs/tags/') && matrix.make-rpm
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build RPM package
        if: startsWith(github.ref, 'refs/tags/') && matrix.make-rpm
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)  RPM_ARCH=x86_64 ;;
            aarch64-unknown-linux-gnu) RPM_ARCH=aarch64 ;;
          esac
          RPM_DIR=$(mktemp -d)
          mkdir -p "$RPM_DIR"/{BUILD,SOURCES,SPECS,SRPMS}
          mkdir -p "$RPM_DIR/RPMS/noarch"
          cp "target/${{ matrix.target }}/release/ar7json" "$RPM_DIR/SOURCES/"
          cat > "$RPM_DIR/SPECS/ar7json.spec" <<EOF
          Name:           ar7json
          Version:        $VERSION
          Release:        1
          Summary:        Standalone AR7 to JSON converter for AVM FRITZ!Box ar7.cfg configuration files
          License:        MIT
          URL:            https://github.com/pfichtner/ar7json
          %description
          Standalone converter between AVM FRITZ!Box ar7.cfg (AR7) format and JSON.
          %install
          mkdir -p %{buildroot}/usr/bin
          cp %{_sourcedir}/ar7json %{buildroot}/usr/bin/ar7json
          cd %{buildroot}/usr/bin
          ln -s ar7json ar7-to-json
          ln -s ar7json json-to-ar7
          ln -s ar7json ar7-check
          ln -s ar7json ar7-fmt
          %files
          %attr(755,root,root) /usr/bin/ar7json
          /usr/bin/ar7-to-json
          /usr/bin/json-to-ar7
          /usr/bin/ar7-check
          /usr/bin/ar7-fmt
          EOF
          rpmbuild -bb --define "_topdir $RPM_DIR" --target "$RPM_ARCH" "$RPM_DIR/SPECS/ar7json.spec"
          cp "$RPM_DIR/RPMS/$RPM_ARCH"/ar7json-*.rpm "ar7json-${{ github.ref_name }}-${{ matrix.target }}.rpm"

      - name: Upload archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ar7json-${{ github.ref_name }}-${{ matrix.target }}
          path: ar7json-${{ github.ref_name }}-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ar7json-${{ github.ref_name }}-*
          path: artifacts/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          for f in *; do
            sha256sum "$f" >> "${{ github.ref_name }}-SHA256SUMS.txt"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*
