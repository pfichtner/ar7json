name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: ar7json-linux-amd64
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-unknown-linux-gnu
            artifact: ar7json-linux-arm64
            os: ubuntu-latest
            use-cross: true
          - target: armv7-unknown-linux-gnueabihf
            artifact: ar7json-linux-armv7
            os: ubuntu-latest
            use-cross: true
          - target: x86_64-unknown-linux-musl
            artifact: ar7json-linux-amd64-musl
            os: ubuntu-latest
            use-cross: true
          - target: x86_64-apple-darwin
            artifact: ar7json-macos-amd64
            os: macos-latest
            use-cross: false
          - target: aarch64-apple-darwin
            artifact: ar7json-macos-arm64
            os: macos-latest
            use-cross: false
          - target: x86_64-pc-windows-msvc
            artifact: ar7json-windows-amd64.exe
            os: windows-latest
            use-cross: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary (cross)
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build release binary (cargo)
        if: ${{ !matrix.use-cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/ar7json${{ endsWith(matrix.artifact, '.exe') && '.exe' || '' }}
          retention-days: 14
