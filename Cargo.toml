[package]
name = "ar7json"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Standalone AR7 ↔ JSON converter for AVM FRITZ!Box ar7.cfg configuration files"
repository = "https://github.com/pfichtner/ar7json"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
miette = { version = "5", features = ["fancy"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
trycmd = "1"

[package.metadata.deb]
maintainer = "Peter Fichtner <1958485+pfichtner@users.noreply.github.com>"
copyright = "2026, Peter Fichtner"
extended-description = """\
Standalone converter between AVM FRITZ!Box ar7.cfg (AR7) format and JSON. \
Parses AVM export files including the header and produces round-trip-safe \
output in both directions."""
depends = "$auto"
section = "utils"
priority = "optional"
license-file = ["LICENSE", "4"]
assets = [["target/release/ar7json", "usr/bin/", "755"]]

[package.metadata.generate-rpm]
assets = [{ source = "target/release/ar7json", dest = "/usr/bin/ar7json", mode = "755" }]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[workspace.metadata.dist]
cargo-dist-version = "0.27.0"
ci = "github"
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
installers = []
checksum = "sha256"
