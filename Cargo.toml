[package]
name = "ar7json"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Standalone AR7 ↔ JSON converter for AVM FRITZ!Box ar7.cfg configuration files"
repository = "https://github.com/ar7json/ar7json"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
miette = { version = "5", features = ["fancy"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
