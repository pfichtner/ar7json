[package]
name = "ar7json"
version = "0.2.0"
edition = "2021"
rust-version = "1.70.0"
license = "MIT"
description = "Standalone AR7 ↔ JSON converter for AVM FRITZ!Box ar7.cfg configuration files"
repository = "https://github.com/pfichtner/ar7json"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
trycmd = "1"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[workspace.metadata.dist]
cargo-dist-version = "0.27.0"
ci = "github"
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
installers = []
checksum = "sha256"
